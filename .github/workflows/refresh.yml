name: 本番公開・日次更新
on:
  schedule:
    # 16:10 UTC = 01:10 JST on the following day
    - cron: '10 16 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: "公開ページの表示方法"
        required: true
        type: choice
        options:
          - 当日
          - 日付指定
        default: 日付指定
      date:
        description: "日付指定の場合のみ使用／当日では無視（YYYY-MM-DD）"
        required: false
        type: string
        default: "2026-11-23"
  push:
    branches: [main]
    paths:
      - index.html
      - app.js
      - styles.css
      - scripts/update.py
      - scripts/verified_sources.py
      - scripts/display_mode.py
      - requirements.txt
      - data/**
      - tests/**
      - overrides/**
      - .github/workflows/refresh.yml
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: assembly-pages
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check holidays.js
          python -m py_compile scripts/update.py scripts/verified_sources.py
      - name: Unit tests
        run: |
          python -m unittest discover -s tests -v
          node tests/test_holidays.cjs
      - name: Select the public display mode
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          DISPLAY_MODE: ${{ inputs.mode }}
          DISPLAY_DATE: ${{ inputs.date }}
        run: python scripts/display_mode.py set --mode "$DISPLAY_MODE" --date "$DISPLAY_DATE"

      - name: Gather the selected date from public schedules
        run: |
          SELECTED_DATE=$(python -c 'import json; from pathlib import Path; x=json.loads(Path("data/display.json").read_text()); print(x["date"] if x.get("mode")=="selected" else "")')
          if [ -n "$SELECTED_DATE" ]; then
            python scripts/update.py --date "$SELECTED_DATE" --output data/selected.json
          fi

      - name: Gather today's information
        run: python scripts/update.py

      - name: Validate the configured public display
        run: python scripts/display_mode.py check

      - name: Save snapshots and mode in repository
        if: ${{ github.event_name != 'push' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data/
          if ! git diff --cached --quiet; then
            git commit -m "data: update morning board and display mode"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then exit 1; fi
              git fetch origin main
              git rebase origin/main
            done
          fi
      - name: Prepare static site
        run: |
          mkdir -p dist/data
          cp index.html app.js holidays.js styles.css .nojekyll dist/
          cp data/today.json data/display.json dist/data/
          if [ -f data/selected.json ]; then cp data/selected.json dist/data/; fi
      # One-time prerequisite: Settings > Pages > Source = GitHub Actions
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
