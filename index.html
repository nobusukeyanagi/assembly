<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f6f3">
<title>本日の開催情報</title>
<link rel="stylesheet" href="./styles.css">
<script defer src="./holidays.js"></script>
<script defer src="./app.js"></script>
</head>
<body>
<main id="stage" class="stage">
  <header class="header"><h1><span id="date">--月--日</span><span id="weekday">（<span id="weekday-label">--</span>）</span></h1><span id="display-mode-indicator" hidden>日付指定表示</span></header>
  <div class="dashboard">
    <section class="panel keirin" aria-label="競輪開催情報">
      <header class="panel-head"><h2>競輪</h2></header>
      <div class="entries" id="keirin-entries"></div>
    </section>
    <section class="panel auto" aria-label="オートレース開催情報">
      <header class="panel-head"><h2>オート<br>レース</h2></header>
      <div class="entries auto-tiles" id="auto-tiles">
        <div class="auto-items" id="auto-entries"></div>
        <section class="entry mori-tile" aria-label="森且行選手の出走予定">
          <div class="mori-heading"><h3>森 且行 選手</h3><span id="mori-status" class="mori-status"></span></div>
          <div id="mori-body" class="mori-body"></div>
        </section>
      </div>
    </section>
    <section class="panel soda" aria-label="SODA開催場情報">
      <header class="panel-head"><h2>SODA</h2></header>
      <div class="entries" id="soda-entries"></div>
    </section>
  </div>
  <section id="final-screen" class="final-screen" hidden aria-label="グレード決勝出走表">
    <div class="final-card" id="final-card"></div>
  </section>
</main>
<div class="fullscreen-hint" role="status" aria-label="F11で全画面表示、Space Keyで出走表表示">
  <div class="fullscreen-hint-line"><kbd>F11</kbd><span>で全画面表示</span></div>
  <div class="fullscreen-hint-line"><kbd>Space Key</kbd><span>で出走表表示</span></div>
</div>
</body>
</html>
