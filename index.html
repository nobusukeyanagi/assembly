<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f6f3">
<title>朝礼モニター｜ASSEMBLY</title>
<link rel="stylesheet" href="./styles.css">
<script defer src="./holidays.js"></script>
<script defer src="./app.js"></script>
</head>
<body>
<main id="stage" class="stage">
  <header class="header"><h1><span id="date">--月--日</span><span id="weekday">（<span id="weekday-label">--</span>）</span></h1></header>
  <div class="dashboard">
    <section class="panel keirin" aria-label="競輪開催情報">
      <header class="panel-head"><h2>競輪</h2></header>
      <div class="entries" id="keirin-entries">読み込み中…</div>
    </section>
    <section class="panel auto" aria-label="オートレース開催情報">
      <header class="panel-head"><h2>オート<br>レース</h2></header>
      <div class="entries auto-tiles" id="auto-tiles">
        <div class="auto-items" id="auto-entries">読み込み中…</div>
        <section class="entry mori-tile" aria-label="森且行選手の出走予定">
          <div class="mori-heading"><h3>森 且行 選手</h3><span id="mori-status" class="mori-status">確認中</span></div>
          <div id="mori-body" class="mori-body">読み込み中…</div>
        </section>
      </div>
    </section>
    <section class="panel soda" aria-label="SODA開催場情報">
      <header class="panel-head"><h2>SODA</h2></header>
      <div class="entries" id="soda-entries">読み込み中…</div>
    </section>
  </div>
</main>
<div class="fullscreen-hint" role="status" aria-label="F11で全画面表示">
  <kbd>F11</kbd><span>で全画面表示</span>
</div>
</body>
</html>
